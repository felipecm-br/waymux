# cargo-deny: run in CI (`cargo deny check`). https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]

[advisories]
# Every RustSec advisory (vulnerable, unmaintained, unsound, yanked) fails the check.
ignore = [
  # chrono is unmaintained (2026-11-20) and has no safe upgrade; waymux only formats and parses
  # timestamps with it. Remove once the quota and launch code moves to jiff.
  { id = "RUSTSEC-2026-0543", reason = "unmaintained, no replacement release; migration to jiff pending" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "Unicode-3.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
