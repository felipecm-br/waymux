[start]
sort = false
ansi = true

[matcher.sort]
threshold = false

[start.command]
command = "__WAYMUX_BIN__ cockpit-items"
additional = [
    "__WAYMUX_BIN__ cockpit-items",
    "__WAYMUX_BIN__ cockpit-items --agents",
]

[columns]
split = '\t'
max = 14
names = [
    { name = "title", ignore = true },
    { name = "idx" },
    { name = "name" },
    { name = "session" },
    { name = "pid" },
    { name = "path" },
    { name = "state" },
    { name = "agent" },
    { name = "age" },
    { name = "branch" },
    { name = "sync" },
    { name = "display", ignore = true }
]

[tui]
mouse = true
percentage = 100
max = 9999

[results]
reverse = false
spinner_prefix = "@SPIN@"
spinner_inline = true
spinner = "minidot"
current_prefix = ""
unselected_prefix = ""
multi = false
row_connection = "Full"
column_spacing = 0

[results.current_style]
modifier = "BOLD"

[results.current_nav_bar_style]
fg = "cyan"
modifier = "BOLD"

[results.autoscroll]
enabled = false

[results.border]
sides = ""

[query]
status_inline = true
prompt = " "
show = true

[footer]
content = " {cyan,bold:Enter} {__MUTED_TEXT__:Jump} {__MUTED_LINE__:│} {cyan,bold:y/n} {__MUTED_TEXT__:Ack} {__MUTED_LINE__:│} {cyan,bold:i} {__MUTED_TEXT__:Input} {__MUTED_LINE__:│} {cyan,bold:g} {__MUTED_TEXT__:Git} {__MUTED_LINE__:│} {cyan,bold:r} {__MUTED_TEXT__:Notes} {__MUTED_LINE__:│} {cyan,bold:?} {__MUTED_TEXT__:Help} {__MUTED_LINE__:│} {cyan,bold:Esc} {__MUTED_TEXT__:Exit}"
row_connection = "Full"
match_indent = false
separator = "light"

[footer.separator_style]
fg = "__MUTED_LINE__"

[ui.nav]
active = true
focus_on_start = "picker"
bar = "Plain"
color = "black"
hints = false

[ui.nav.binds]
"tab"           = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 'tab' '{=state}' '{=session}:{=idx}')", "Print(__SWITCH_AWT__{=})", "Quit"]
"shift-tab"     = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 'shift-tab' '{=state}' '{=session}:{=idx}')", "Print(__SWITCH_AWT__{=})", "Quit"]
"backtab"       = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 'backtab' '{=state}' '{=session}:{=idx}')", "Print(__SWITCH_AWT__{=})", "Quit"]
"shift-backtab" = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 'shift-backtab' '{=state}' '{=session}:{=idx}')", "Print(__SWITCH_AWT__{=})", "Quit"]
"backspace"     = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 'backspace' '{=state}' '{=session}:{=idx}')", "Print(__JUMP_LAST_AGENT__)", "Quit"]
"ctrl-h"        = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 'ctrl-h' '{=state}' '{=session}:{=idx}')", "Print(__JUMP_LAST_AGENT__)", "Quit"]
"a"             = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 'a' '{=state}' '{=session}:{=idx}')", "@reloadnext"]
"A"             = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 'A' '{=state}' '{=session}:{=idx}')", "@reloadprev"]
"ctrl-a"        = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 'ctrl-a' '{=state}' '{=session}:{=idx}')", "@reloadnext"]
"o"             = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 'o' '{=state}' '{=session}:{=idx}')", "Print(__OPEN_PR__{=})", "Quit"]
"O"             = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 'O' '{=state}' '{=session}:{=idx}')", "Print(__OPEN_PR_CHECKS__{=})", "Quit"]
"/"             = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit '/' '{=state}' '{=session}:{=idx}')", "FocusFilter"]
"s"             = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 's' '{=state}' '{=session}:{=idx}')", "Print(__SWITCH_SESSION__)", "Quit"]
"S"             = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 'S' '{=state}' '{=session}:{=idx}')", "Print(__SHIP_WORKTREE__{=})", "Quit"]
"r"             = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 'r' '{=state}' '{=session}:{=idx}')", "Execute(__WAYMUX_BIN__ review-notes send \"{=path}\" \"{=session}\" \"{=idx}\" \"{=pid}\")", "Reload(__WAYMUX_BIN__ cockpit-items)"]
"w"             = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 'w' '{=state}' '{=session}:{=idx}')", "Print(__NEW_WORKTREE__{=})", "Quit"]
"W"             = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 'W' '{=state}' '{=session}:{=idx}')", "Print(__SWEEP_WORKTREES__{=})", "Quit"]
"R"             = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 'R' '{=state}' '{=session}:{=idx}')", "Print(__REAP_AGENTS__{=})", "Quit"]
"t"             = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 't' '{=state}' '{=session}:{=idx}')", "Print(__CREATE_WINDOW__{=})", "Quit"]
"T"             = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 'T' '{=state}' '{=session}:{=idx}')", "Print(__CREATE_WINDOW__{=})", "Quit"]
"c"             = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 'c' '{=state}' '{=session}:{=idx}')", "Print(__NEW_WORKTREE__{=})", "Quit"]
"C"             = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 'C' '{=state}' '{=session}:{=idx}')", "Print(__NEW_WORKTREE__{=})", "Quit"]
"g"             = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 'g' '{=state}' '{=session}:{=idx}')", "Print(__LAZYGIT__{=})", "Quit"]
"gg"            = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 'gg' '{=state}' '{=session}:{=idx}')", "Print(__LAZYGIT__{=})", "Quit"]
"G"             = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 'G' '{=state}' '{=session}:{=idx}')", "Print(__LAZYGIT__{=})", "Quit"]
"ctrl-g"        = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 'ctrl-g' '{=state}' '{=session}:{=idx}')", "Print(__LAZYGIT__{=})", "Quit"]
"p"             = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 'p' '{=state}' '{=session}:{=idx}')", "Print(__PATCH_MODE__{=})", "Quit"]
"P"             = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 'P' '{=state}' '{=session}:{=idx}')", "Print(__PATCH_MODE__{=})", "Quit"]
"ctrl-p"        = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 'ctrl-p' '{=state}' '{=session}:{=idx}')", "Print(__PATCH_MODE__{=})", "Quit"]
"?"             = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit '?' '{=state}' '{=session}:{=idx}')", "SwitchPreview(1)"]
"shift-?"       = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 'shift-?' '{=state}' '{=session}:{=idx}')", "SwitchPreview(1)"]
"F1"            = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 'F1' '{=state}' '{=session}:{=idx}')", "SwitchPreview(1)"]
"i"             = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 'i' '{=state}' '{=session}:{=idx}')", "LiveInput(tmux send-keys -t '{=pid}' {=keys})"]
"I"             = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 'I' '{=state}' '{=session}:{=idx}')", "PromptInput(__WAYMUX_BIN__ agent-action prompt '{=state}' '{=pid}' {input})", "Reload(__WAYMUX_BIN__ cockpit-items)"]
"y"             = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 'y' '{=state}' '{=session}:{=idx}')", "ExecuteAsync(__WAYMUX_BIN__ agent-action approve '{=state}' '{=pid}')", "Reload(__WAYMUX_BIN__ cockpit-items)"]
"Y"             = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 'Y' '{=state}' '{=session}:{=idx}')", "ExecuteAsync(__WAYMUX_BIN__ agent-action approve '{=state}' '{=pid}')", "Reload(__WAYMUX_BIN__ cockpit-items)"]
"n"             = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 'n' '{=state}' '{=session}:{=idx}')", "ExecuteAsync(__WAYMUX_BIN__ agent-action deny '{=state}' '{=pid}')", "Reload(__WAYMUX_BIN__ cockpit-items)"]
"N"             = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 'N' '{=state}' '{=session}:{=idx}')", "ExecuteAsync(__WAYMUX_BIN__ agent-action deny '{=state}' '{=pid}')", "Reload(__WAYMUX_BIN__ cockpit-items)"]
"d"             = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 'd' '{=state}' '{=session}:{=idx}')", "ExecuteAsync(printf '%s\n' '{=}' | __WAYMUX_BIN__ window-delete; sleep 0.05)", "Reload(__WAYMUX_BIN__ cockpit-items)"]
"ctrl-d"        = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 'ctrl-d' '{=state}' '{=session}:{=idx}')", "ExecuteAsync(printf '%s\n' '{=}' | __WAYMUX_BIN__ window-delete; sleep 0.05)", "Reload(__WAYMUX_BIN__ cockpit-items)"]
"x"             = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 'x' '{=state}' '{=session}:{=idx}')", "ExecuteAsync(printf '%s\n' '{=}' | __WAYMUX_BIN__ window-delete; sleep 0.05)", "Reload(__WAYMUX_BIN__ cockpit-items)"]
"J"             = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 'J' '{=state}' '{=session}:{=idx}')", "PreviewDown(5)"]
"K"             = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 'K' '{=state}' '{=session}:{=idx}')", "PreviewUp(5)"]
"+"             = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit '+' '{=state}' '{=session}:{=idx}')", "ExpandPreview(5)"]
"="             = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit '=' '{=state}' '{=session}:{=idx}')", "ExpandPreview(5)"]
"-"             = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit '-' '{=state}' '{=session}:{=idx}')", "ShrinkPreview(5)"]
"ctrl-r"        = ["ExecuteAsync(__WAYMUX_BIN__ keylog cockpit 'ctrl-r' '{=state}' '{=session}:{=idx}')", "Reload(__WAYMUX_BIN__ cockpit-items)"]
","             = []

[ui.border]
sides = ""

[previewer]
debounce_ms = 20
delay_clear = true

[preview]
show = true
wrap = false
poll_ms = 250

[preview.media]
active = false

[preview.initial]
tail = true

[preview.border]
sides = "LEFT"
color = "__MUTED_LINE__"

[[preview.layout]]
command = '__WAYMUX_BIN__ cockpit-preview "{=session}" "{=idx}" "{=pid}" "{=path}" "{=state}" "{=agent}" "{=age}" "{=branch}" "{=sync}"'
side = "right"
percentage = 60
scroll.tail = true
poll_ms = 250

[[preview.layout]]
command = '__WAYMUX_BIN__ cockpit-help'
side = "right"
percentage = 60

[binds]
