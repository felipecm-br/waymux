    "ToggleColumn(title)", "ToggleColumn(name)", "ToggleColumn(session)",
    "ToggleColumn(idx)", "ToggleColumn(pid)", "ToggleColumn(path)",
    "ToggleColumn(state)", "ToggleColumn(agent)", "ToggleColumn(age)",
    "ToggleColumn(branch)", "ToggleColumn(sync)"
