# Sandbox tmux config: minimal chrome + the Waymux plugin.
# Window badges come from the options the daemon sets per pane:
#   @ai_agent_state (icon), @ai_agent_state_color, @ai_agent_title

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set-environment -g PATH "/usr/local/bin:/home/dev/.local/bin:/usr/local/share/waymux-sandbox/fake-bin:/usr/bin:/bin"
set -g mouse on
set -g base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g history-limit 20000

# Status bar (refresh is event-driven: waymux.tmux sets status-interval 0)
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 30
set -g status-left "#[fg=#89b4fa,bold] #S #[default]│ "
set -g status-right-length 80
set -g status-right "#[fg=#6c7086]prefix+Space cockpit  prefix+i triage  prefix+I jump #[default]"
set -g window-status-separator ""
set -g window-status-format " #I #{?@ai_agent_title,#{=24:@ai_agent_title},#W} #[fg=#{@ai_agent_state_color}]#{@ai_agent_state}#[default] "
set -g window-status-current-format "#[bg=#313244,bold] #I #{?@ai_agent_title,#{=24:@ai_agent_title},#W} #[fg=#{@ai_agent_state_color}]#{@ai_agent_state}#[default]#[bg=#313244] #[default]"

# Waymux: cockpit (prefix+Space), triage (prefix+i / prefix+I), diff (C-g), session picker (prefix+s)
run-shell "/usr/local/share/waymux/tmux/waymux.tmux"
