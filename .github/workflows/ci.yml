name: CI Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check Formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy Lints
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run Unit Test Suite
        run: cargo test --all-targets

  docker-e2e:
    # 8-step end-to-end suite in an isolated tmux container (scripts/docker-sandbox.sh).
    runs-on: ubuntu-latest
    needs: check-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build Release Binary
        run: cargo build --release --bin waymux
      - name: Run Docker End-to-End Suite
        run: WAYMUX_BIN="$PWD/target/release/waymux" ./scripts/docker-sandbox.sh test
