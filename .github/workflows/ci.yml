name: CI Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a new RustSec advisory against a locked dependency shows up without a push.
    - cron: "0 6 * * 1"

# Every job only reads the repository. Actions are pinned to commit SHAs (Dependabot bumps
# them), so a moved tag cannot change what runs.
permissions:
  contents: read

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check Formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy Lints
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run Unit Test Suite
        run: cargo test --all-targets

  macos:
    # Releases ship macOS binaries; /proc-based stall detection and Cockpit CPU are Linux-only
    # and skip themselves, everything else must pass here too.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - name: Run Clippy Lints
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run Test Suite
        run: cargo test --all-targets

  msrv:
    # Builds with the oldest supported compiler (`rust-version` in Cargo.toml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.88"
      - name: Check on the MSRV
        run: cargo check --all-targets --locked

  coverage:
    # Line coverage of the unit + integration tests; the floor keeps it from sliding back.
    # The Docker suite (tmux popups, delta, wt scripts) is not counted.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov
      - name: Measure Coverage
        run: cargo llvm-cov --summary-only --fail-under-lines 62

  dependencies:
    # Advisories, licenses, duplicate crates and sources (deny.toml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  docker-e2e:
    # 8-step end-to-end suite in an isolated tmux container (scripts/docker-sandbox.sh).
    runs-on: ubuntu-latest
    needs: check-and-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Build Release Binary
        run: cargo build --release --bin waymux
      - name: Check Hot-Path Budgets
        # Shared runners are noisy; 4x catches a real regression (e.g. Tokio starting
        # before the command router) without flaking.
        run: BENCH_SLACK=4 ./scripts/bench.sh --check target/release/waymux
      - name: Run Docker End-to-End Suite
        run: WAYMUX_BIN="$PWD/target/release/waymux" ./scripts/docker-sandbox.sh test
