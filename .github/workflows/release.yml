name: Release waymux & acpd

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (musl - fully static standalone binary)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          # Linux ARM64 (musl - fully static standalone binary)
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          # Linux x86_64 (gnu - standard glibc)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # Linux ARM64 (gnu - standard glibc)
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          # macOS Apple Silicon (M1/M2/M3/M4)
          - target: aarch64-apple-darwin
            os: macos-latest
          # macOS Intel (x86_64 cross-compiled on macos-latest)
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build and Upload waymux Binary Asset
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: waymux
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Upload acpd Binary Asset
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: acpd
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
