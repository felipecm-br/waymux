[package]
name = "waymux-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
waymux = { path = "..", features = ["fuzzing"] }

# Not part of the main build: `cargo fuzz` builds this crate on its own.
[workspace]
members = ["."]

[[bin]]
name = "hook_input"
path = "fuzz_targets/hook_input.rs"
test = false
doc = false
bench = false

[[bin]]
name = "review_notes"
path = "fuzz_targets/review_notes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config"
path = "fuzz_targets/config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rpc_body"
path = "fuzz_targets/rpc_body.rs"
test = false
doc = false
bench = false
